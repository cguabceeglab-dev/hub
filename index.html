    const r=await fetch(url,{signal:ctl.signal}); const j=await r.json();
    return j&&j.ok ? j : null;
  }catch(e){ return null; } finally{ clearTimeout(t); }
}
async function upload(rec){
  if(!CONFIG.ENDPOINT) return false;
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),20000);
  try{
    const r=await fetch(CONFIG.ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:CONFIG.TOKEN,record:rec}),signal:ctl.signal});
    const j=await r.json(); return !!(j&&j.ok);
  }catch(e){ return false; } finally{ clearTimeout(t); }
}
async function retryPending(){
  const list=load(); let n=0;
  for(const r of list){ if(r.finished&&!r.uploaded){ if(await upload(r)){ r.uploaded=true; n++; } } }
  save(list); return n;
}

/* 決定這次是前測或後測、用哪一卷 */
async function resolveCode(code){
  const local=load().filter(r=>r.code===code&&r.finished).map(r=>({phase:r.phase,form:r.form}));
  const rs=await remoteStatus(code);
  const done=local.slice();
  if(rs&&Array.isArray(rs.done)) rs.done.forEach(d=>{ if(!done.some(x=>x.phase===d.phase)) done.push(d); });
  const pre=done.find(d=>d.phase==="pre"), post=done.find(d=>d.phase==="post");
  const rosterAssign = rs&&/^(AB|BA)$/.test(rs.assign||"") ? rs.assign : null;
  const assign = rosterAssign || parityAssign(code);
  const res={code,online:!!rs,configured:!!CONFIG.ENDPOINT,assignSource: rosterAssign?"名單":"代號單雙號"};
  if(post&&pre){ res.phase="done"; res.preForm=pre.form; res.postForm=post.form; return res; }
  if(pre){ res.phase="post"; res.form=other(pre.form); res.assign=pre.form+res.form; res.assignSource="依前測卷別"; return res; }
  res.phase="pre"; res.assign=assign; res.form=assign?assign[0]:null; return res;
}

    <div class="q">長者有沒有說出或做出查證方式？</div>
    <div class="row"><button type="button" class="choice ${r.verify?"on":""}" id="bVer">長者說出或做出一種查證方式</button></div>
    <label for="how" style="margin-top:10px">查證方式（打 165／問家人／打帳單上或官方電話／親自去…）</label><input id="how" value="${esc(r.verifyHow)}">
    <label for="snote" style="margin-top:10px">備註（長者說了什麼、卡在哪）</label><textarea id="snote">${esc(r.note)}</textarea>
    <div class="foot"><button type="button" id="prev">回模擬操作</button><button class="primary" type="button" id="next">完成紀錄，下一步</button></div></div>`);
    document.getElementById("bVer").onclick=()=>{r.verify=!r.verify;render();};
    document.getElementById("how").oninput=e=>{r.verifyHow=e.target.value;saveCur();};
    document.getElementById("snote").oninput=e=>{r.note=e.target.value;saveCur();};
    document.getElementById("prev").onclick=screenSim;
    document.getElementById("next").onclick=()=> S.phase==="pre"?screenSafety():screenAccept();
  }
  render();
}

/* ---------- 畫面：前測安全確認 / 後測接受度與滿意度 ---------- */
function choiceGroup(key,opts,obj){ return `<div class="row" data-k="${key}">${opts.map(o=>`<button type="button" class="choice ${obj[key]===o?"on":""}" data-v="${esc(o)}" style="font-size:20px;min-height:56px">${esc(o)}</button>`).join("")}</div>`; }
function bindGroups(obj,onchange){ app.querySelectorAll("[data-k]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{obj[g.dataset.k]=b.dataset.v; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); onchange&&onchange();})); }
function screenSafety(){
  if(S&&S.where!=="end") progress("end");
  const e=S.extra;
  h(`<div class="panel" style="max-width:860px"><span class="pill">前測結尾 · 安全確認</span>
   <div class="q">「最近有沒有人向您要錢，或要您替他管錢、簽名，讓您覺得不舒服？」</div>${choiceGroup("safe1",["是","否"],e)}
   <div class="q">「您覺得自己的錢現在安全嗎？」</div>${choiceGroup("safe2",["安全","不太安全","不安全"],e)}
   <div class="note" style="margin-top:14px">任一題有疑慮：施測照常完成，結束後私下告訴教師或社工，不在長者面前討論。</div>
   <div class="foot"><button type="button" id="prev">回學生紀錄</button><button class="primary" type="button" id="next" disabled>完成前測</button></div></div>`);
  const chk=()=>{document.getElementById("next").disabled=!(e.safe1&&e.safe2);}; bindGroups(e,chk); chk();
  document.getElementById("prev").onclick=screenSimRecord; document.getElementById("next").onclick=finish;
}
function screenAccept(){
  if(S&&S.where!=="end") progress("end");
  const e=S.extra; const sat=["非常不滿意","不滿意","普通","滿意","非常滿意"];
  h(`<div class="panel" style="max-width:900px"><span class="pill">後測結尾 · 課程接受度與活動滿意度</span>
   <div class="q">今天教的內容好不好懂？</div>${choiceGroup("acc1",["好懂","還可以","不好懂"],e)}
   <div class="q">對您有沒有用？</div>${choiceGroup("acc2",["有用","還可以","沒用"],e)}
   <div class="q">會不會推薦給朋友？</div>${choiceGroup("acc3",["會","可能","不會"],e)}
   <h3 style="font-size:20px;margin-top:22px">USR 活動滿意度</h3>
   <div class="q">1. 今天的活動整體您滿意嗎？</div>${choiceGroup("usr1",sat,e)}
   <div class="q">2. 學生講解清楚嗎？</div>${choiceGroup("usr2",sat,e)}
   <div class="q">3. 時間安排合適嗎？</div>${choiceGroup("usr3",sat,e)}
   <div class="q">4. 場地和設備合適嗎？</div>${choiceGroup("usr4",sat,e)}
   <div class="q">5. 以後有類似活動，您願意再來嗎？</div>${choiceGroup("usr5",sat,e)}
   <div class="q">「今天有什麼地方可以做得更好？」<small>學生記錄原話</small></div><textarea id="open">${esc(e.open||"")}</textarea>
   <div class="foot"><button type="button" id="prev">回學生紀錄</button><button class="primary" type="button" id="next" disabled>完成後測</button></div></div>`);
  const need=["acc1","acc2","acc3","usr1","usr2","usr3","usr4","usr5"];
  const chk=()=>{document.getElementById("next").disabled=!need.every(k=>e[k]);}; bindGroups(e,chk); chk();
  document.getElementById("open").oninput=ev=>{e.open=ev.target.value;};
  document.getElementById("prev").onclick=screenSimRecord; document.getElementById("next").onclick=finish;
}
async function finish(){
  S.end=new Date().toISOString(); S.finished=true;
  const rec=S; const list=load().filter(r=>r.rid!==rec.rid); list.push(rec); save(list); clearCur();
  const code=rec.code, phase=rec.phase, form=rec.form; S=null; sessPill.hidden=true;
  h(`<div class="panel" style="max-width:720px"><h2 style="font-size:24px">已完成：${esc(code)} ${phase==="pre"?"前測":"後測"}（${form} 卷）</h2><p id="upmsg">${CONFIG.ENDPOINT?"上傳到後台中…":"尚未連接後台，資料已存在這台平板。"}</p></div>`);
  let ok=false;
  if(CONFIG.ENDPOINT){ ok=await upload(rec); if(ok){ const l=load(); const x=l.find(r=>r.rid===rec.rid); if(x){x.uploaded=true; save(l);} } }
  h(`<div class="panel" style="max-width:720px"><h2 style="font-size:24px">已完成：${esc(code)} ${phase==="pre"?"前測":"後測"}（${form} 卷）</h2>
  ${ok?`<p style="color:var(--ok);font-weight:700">✓ 已上傳到後台。</p>`:CONFIG.ENDPOINT?`<div class="note" style="color:var(--bad)">✕ 上傳失敗（可能網路不穩）。資料已存在這台平板，請到「紀錄與匯出」按「重新上傳」。</div>`:`<p>資料已存在這台平板。</p>`}
  <p>${phase==="pre"?`介入後再輸入同一個代號 ${esc(code)}，會自動進入後測（${other(form)} 卷）。`:"這位長者的前後測都完成了。"}</p>
  <div class="row"><button class="primary" type="button" id="again">施測下一位</button><button type="button" id="adm">紀錄與匯出</button></div></div>`);
  document.getElementById("again").onclick=()=>screenStart(); document.getElementById("adm").onclick=screenAdmin;
}

/* ---------- 紀錄與匯出（這台平板） ---------- */
function toCSV(list){
  const head=["代號","階段","卷別","分派","開始","結束","序","題號","真假","把握","照做","追問","模擬_點連結","模擬_封鎖","模擬_刪除","模擬_查證","模擬_查證方式","模擬_備註","安全1","安全2","接受1","接受2","接受3","USR1","USR2","USR3","USR4","USR5","開放意見"];
  const rows=[head];
  list.forEach(r=>{ const e=r.extra||{}, s=r.sim||{};
    (r.answers||[]).forEach((a,i)=>rows.push([r.code,r.phase,r.form,r.assign,r.start,r.end||"",a.seq,a.id,a.q1,a.q1c,a.q2,a.follow||"", i===0?(s.clicked?1:0):"", i===0?(s.blocked?1:0):"", i===0?(s.deleted?1:0):"", i===0?(s.verify?1:0):"", i===0?(s.verifyHow||""):"", i===0?(s.note||""):"", i===0?(e.safe1||""):"", i===0?(e.safe2||""):"", i===0?(e.acc1||""):"", i===0?(e.acc2||""):"", i===0?(e.acc3||""):"", i===0?(e.usr1||""):"", i===0?(e.usr2||""):"", i===0?(e.usr3||""):"", i===0?(e.usr4||""):"", i===0?(e.usr5||""):"", i===0?(e.open||""):""])); });
  return "﻿"+rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""').replace(/\n/g," ")}"`).join(",")).join("\r\n");
}
function screenAdmin(){
  const list=load(); const pend=list.filter(r=>r.finished&&!r.uploaded).length;
  h(`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="font-size:22px">紀錄與匯出（這台平板）</h2><button type="button" id="back">回施測</button></div>
   <p class="muted">這台平板共 ${list.length} 筆；${CONFIG.ENDPOINT?`尚未上傳 ${pend} 筆。全部資料以老師的 Google 試算表為準，這裡是備份。`:"尚未連接後台，請在活動結束後匯出 CSV。"}</p>
   <div class="row" style="margin:10px 0">${CONFIG.ENDPOINT?`<button class="primary" type="button" id="up" ${pend?"":"disabled"}>重新上傳未上傳的 ${pend} 筆</button>`:""}<button type="button" id="dl">下載 CSV</button><button type="button" id="cp">複製 CSV</button><button type="button" id="clr">清除這台平板的紀錄</button></div>
   <div id="msg" class="muted"></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>代號</th><th>階段</th><th>卷</th><th>開始</th><th>用時</th><th>上傳</th></tr></thead><tbody>
   ${list.map(r=>`<tr><td>${esc(r.code)}</td><td>${r.phase==="pre"?"前測":"後測"}</td><td>${esc(r.form)}</td><td>${esc((r.start||"").slice(5,16).replace("T"," "))}</td><td>${r.end?Math.round((new Date(r.end)-new Date(r.start))/60000)+" 分":"未完成"}</td><td>${r.uploaded?"✓":"未上傳"}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">尚無紀錄</td></tr>`}
   </tbody></table></div>
   <textarea id="csvbox" style="margin-top:12px;min-height:120px;font-size:13px" readonly>${esc(toCSV(list))}</textarea></div>`);
  const msg=document.getElementById("msg");
  document.getElementById("back").onclick=()=>S?screenItem(S.step||0):screenStart();
  const up=document.getElementById("up");
  if(up) up.onclick=async()=>{ up.disabled=true; msg.textContent="上傳中…"; const n=await retryPending(); const left=load().filter(r=>r.finished&&!r.uploaded).length; screenAdmin(); document.getElementById("msg").textContent=`已上傳 ${n} 筆${left?`；仍有 ${left} 筆失敗，請確認網路後再試。`:"。"}`; };
  document.getElementById("dl").onclick=()=>{ try{ const blob=new Blob([toCSV(list)],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`hub1204_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); msg.textContent="已嘗試下載；若沒有反應請改用複製。"; }catch(e){ msg.textContent="這個環境不允許下載，請改用複製。"; } };
  document.getElementById("cp").onclick=()=>{ const t=toCSV(list); navigator.clipboard.writeText(t).then(()=>msg.textContent="已複製。").catch(()=>{ const b=document.getElementById("csvbox"); b.focus(); b.select(); msg.textContent="無法自動複製，已全選文字框，請手動複製。"; }); };
  let armed=false; document.getElementById("clr").onclick=e=>{ if(pend&&!armed){ msg.textContent=`還有 ${pend} 筆沒上傳，清除會遺失。`; } if(!armed){armed=true;e.target.textContent="再按一次確認清除";return;} save([]); screenAdmin(); };
}

document.getElementById("btnAdmin").onclick=screenAdmin;
screenStart();
})();
</script>
</body></html>
