function beginSession(stu,code,assign){
  const phase=phaseFor(code);
  if(phase==="done"){ screenStart(`${code} 的前測與後測都已完成。若要重做，請到「紀錄與匯出」刪除該筆。`); return; }
  const form = phase==="pre" ? assign[0] : assign[1];
  S={stu,code,assign,phase,form,start:new Date().toISOString(),answers:[],sim:null,extra:{},step:0,finished:false};
  sessPill.textContent=`${code} · ${phase==="pre"?"前測":"後測"} · ${form} 卷 · 學生 ${stu}`; sessPill.hidden=false;
  screenIntro();
}
function screenIntro(){
  h(`<div class="panel" style="max-width:820px">
    <h2 style="font-size:22px;margin-bottom:10px">${S.phase==="pre"?"前測":"後測"}開場（照唸）</h2>
    <p class="scen" style="font-size:22px">「阿公／阿嬤您好，我是長庚大學的學生。等一下我會唸十個生活裡可能遇到的狀況給您聽，每一個我都會問您幾個問題：您覺得這件事是真的還是騙人的、有多確定，還有如果是您，您會不會照著做。這不是考試，沒有對錯，我們只是想知道您平常會怎麼想、怎麼做。您可以用手指螢幕上的答案，也可以直接跟我說。聽不清楚可以叫我再唸一次。我們開始好嗎？」</p>
    <div class="note">提醒：不說「對」「答得好」「這個是騙人的」。長者反問時回答「您覺得呢？照您的想法答就好」。</div>
    <div class="foot"><button type="button" id="quit">取消</button><button class="primary" type="button" id="next">開始第 1 題</button></div></div>`);
  document.getElementById("quit").onclick=()=>{S=null;screenStart();};
  document.getElementById("next").onclick=()=>screenItem(0);
}

/* ---------- 刺激卡 ---------- */
function cardHTML(c){
  if(c.k==="call") return `<div class="phone call"><div class="bar"><span>09:41</span><span>▂▄▆ 4G</span></div><div class="body"><div class="avatar">☎</div><div class="big">${esc(c.name)}</div><div class="sub">${esc(c.sub)}</div><div class="sub">來電中…</div><div class="callbtns"><div class="cb r">✕</div><div class="cb g">✓</div></div></div></div>`;
  if(c.k==="line") return `<div class="phone"><div class="bar"><span>09:41</span><span>▂▄▆ 4G</span></div><div class="hd"><div class="ic">💬</div>${esc(c.title)}</div><div class="body">${c.msgs.map(m=>`<div class="bub">${esc(m)}</div>`).join("")}</div></div>`;
  if(c.k==="video") return `<div class="phone"><div class="bar"><span>09:41</span><span>▂▄▆ 4G</span></div><div class="hd"><div class="ic">▶</div>影片</div><div class="body"><div class="vid">▶</div><div><b>${esc(c.title)}</b></div><div class="cap">${esc(c.cap)}</div></div></div>`;
  if(c.k==="bill") return `<div class="phone paper"><div class="hd"><div class="ic">🧾</div>${esc(c.title)}</div><div class="body">${c.lines.map(l=>`<div class="bub">${esc(l)}</div>`).join("")}</div></div>`;
  return `<div class="phone paper"><div class="hd"><div class="ic">📍</div>${esc(c.title)}</div><div class="body">${c.lines.map(l=>`<div class="bub">${esc(l)}</div>`).join("")}</div></div>`;
}
function progHTML(i,total){ let s=""; for(let k=0;k<total;k++) s+=`<i class="${k<i?"done":k===i?"cur":""}"></i>`; return `<div class="prog">${s}</div>`; }

/* ---------- 畫面：情境題 ---------- */
function screenItem(i){
  const n=ORDER[i], id=S.form+n, it=ITEMS[id];
  const a=S.answers[i]||{id,n,seq:i+1,q1:"",q1c:"",q2:"",follow:"",t0:new Date().toISOString()};
  S.answers[i]=a;
  h(`<div class="panel">
    <div class="row" style="justify-content:space-between;align-items:center"><span class="pill">第 ${i+1}／10 題</span><span class="muted">題號 ${esc(id)}</span></div>
    ${progHTML(i,10)}
    <div class="stage">
      <div>${cardHTML(it.card)}</div>
      <div>
        <p class="scen">${esc(it.t)}</p>
        <div class="q">一、您覺得這件事是真的，還是騙人的？</div>
        <div class="row" data-g="q1"><button type="button" class="choice" data-v="真的">真的</button><button type="button" class="choice" data-v="騙人的">騙人的</button><button type="button" class="choice" data-v="未作答" style="flex:0 1 120px;font-size:17px">未作答</button></div>
        <div class="q">　　您有多確定？</div>
        <div class="row" data-g="q1c"><button type="button" class="choice" data-v="很確定">很確定</button><button type="button" class="choice" data-v="有點確定">有點確定</button><button type="button" class="choice" data-v="不太確定">不太確定</button></div>
        <div class="q">二、${esc(it.q3||"如果是您，您會照著做嗎？")}</div>
        <div class="row" data-g="q2"><button type="button" class="choice" data-v="一定會">一定會</button><button type="button" class="choice" data-v="可能會">可能會</button><button type="button" class="choice" data-v="可能不會">可能不會</button><button type="button" class="choice" data-v="一定不會">一定不會</button></div>
        <div class="q">追問<small>「那您接下來會怎麼做？」寫長者原話，不改寫。前後測都要問；前測因超時沒問的話，後測也不問。</small></div>
        <textarea id="follow" placeholder="長者原話">${esc(a.follow)}</textarea>
      </div>
    </div>
    <div class="foot"><button type="button" id="prev" ${i===0?"disabled":""}>上一題</button><span class="muted" id="hint">三個答案都點了才能下一題（長者再問一次仍不答，點「未作答」，不要替他選）</span><button class="primary" type="button" id="next" disabled>${i===9?"完成情境題":"下一題"}</button></div>
  </div>`);
  const groups=app.querySelectorAll("[data-g]");
  function refresh(){ groups.forEach(g=>{ const key=g.dataset.g; g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===a[key])); });
    const ok=a.q1&&(a.q1==="未作答"||a.q1c)&&a.q2; document.getElementById("next").disabled=!ok; document.getElementById("hint").textContent= ok?"":"三個答案都點了才能下一題"; }
  groups.forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ a[g.dataset.g]=b.dataset.v; refresh(); }));
  refresh();
  document.getElementById("follow").oninput=e=>{a.follow=e.target.value;};
  document.getElementById("prev").onclick=()=>screenItem(i-1);
  document.getElementById("next").onclick=()=>{ a.t1=new Date().toISOString(); if(i<9) screenItem(i+1); else screenSim(); };
}

/* ---------- 畫面：模擬操作 ---------- */
function screenSim(){
  const sim=SIM[S.phase]; const r=S.sim||{clicked:false,blocked:false,deleted:false,verify:false,verifyHow:"",note:""}; S.sim=r;
  function render(){
    h(`<div class="panel"><span class="pill">模擬操作</span>
    <div class="stage" style="margin-top:10px">
      <div>
        <div class="phone"><div class="bar"><span>09:41</span><span>▂▄▆ 4G</span></div><div class="hd"><div class="ic">✉</div>${esc(sim.from)}</div>
        <div class="body"><div class="bub">${esc(sim.text)}<br><span class="link" id="simLink">${esc(sim.link)}</span></div>
        ${r.clicked?`<div class="warnpage">⚠ 已點開連結：頁面要求輸入姓名、身分證字號與銀行帳號。（模擬，無實際頁面）</div>`:""}
        <div class="menu"><button type="button" id="bBlock" class="${r.blocked?"on":""}">${r.blocked?"已封鎖此號碼":"封鎖此號碼"}</button><button type="button" id="bDel" class="${r.deleted?"on":""}">${r.deleted?"已刪除訊息":"刪除訊息"}</button></div>
        </div></div>
      </div>
      <div>
        <p class="scen" style="font-size:22px">「現在請您做給我看，如果您的手機收到這一則，您會怎麼處理？」</p>
        <div class="note">把平板交給長者自己操作。不提示。長者說「不知道」就不要引導。</div>
        <div class="q">學生記錄</div>
        <div class="row"><button type="button" class="choice ${r.verify?"on":""}" id="bVer">長者說出或做出一種查證方式</button></div>
        <label for="how" style="margin-top:10px">查證方式（打 165／問家人／打帳單上或官方電話／親自去…）</label><input id="how" value="${esc(r.verifyHow)}">
        <label for="snote" style="margin-top:10px">備註（長者說了什麼、卡在哪）</label><textarea id="snote">${esc(r.note)}</textarea>
        <div class="muted" style="margin-top:8px">自動記錄：${r.clicked?"有點連結":"沒點連結"}；${r.blocked?"已封鎖":"未封鎖"}；${r.deleted?"已刪除":"未刪除"}</div>
      </div>
    </div>
    <div class="foot"><button type="button" id="prev">回上一題</button><button class="primary" type="button" id="next">完成模擬操作</button></div></div>`);
    document.getElementById("simLink").onclick=()=>{r.clicked=true;render();};
    document.getElementById("bBlock").onclick=()=>{r.blocked=!r.blocked;render();};
    document.getElementById("bDel").onclick=()=>{r.deleted=!r.deleted;render();};
    document.getElementById("bVer").onclick=()=>{r.verify=!r.verify;render();};
    document.getElementById("how").oninput=e=>{r.verifyHow=e.target.value;};
    document.getElementById("snote").oninput=e=>{r.note=e.target.value;};
    document.getElementById("prev").onclick=()=>screenItem(9);
    document.getElementById("next").onclick=()=> S.phase==="pre"?screenSafety():screenAccept();
  }
  render();
}

/* ---------- 畫面：前測安全確認 / 後測接受度與滿意度 ---------- */
function choiceGroup(key,opts,obj){ return `<div class="row" data-k="${key}">${opts.map(o=>`<button type="button" class="choice ${obj[key]===o?"on":""}" data-v="${esc(o)}" style="font-size:20px;min-height:56px">${esc(o)}</button>`).join("")}</div>`; }
function bindGroups(obj,onchange){ app.querySelectorAll("[data-k]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{obj[g.dataset.k]=b.dataset.v; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); onchange&&onchange();})); }
function screenSafety(){
  const e=S.extra;
  h(`<div class="panel" style="max-width:860px"><span class="pill">前測結尾 · 安全確認</span>
   <div class="q">「最近有沒有人向您要錢，或要您替他管錢、簽名，讓您覺得不舒服？」</div>${choiceGroup("safe1",["是","否"],e)}
   <div class="q">「您覺得自己的錢現在安全嗎？」</div>${choiceGroup("safe2",["安全","不太安全","不安全"],e)}
   <div class="note" style="margin-top:14px">任一題有疑慮：施測照常完成，結束後私下告訴教師或社工，不在長者面前討論。</div>
   <div class="foot"><button type="button" id="prev">回模擬操作</button><button class="primary" type="button" id="next" disabled>完成前測</button></div></div>`);
  const chk=()=>{document.getElementById("next").disabled=!(e.safe1&&e.safe2);}; bindGroups(e,chk); chk();
  document.getElementById("prev").onclick=screenSim; document.getElementById("next").onclick=finish;
}
function screenAccept(){
  const e=S.extra; const sat=["非常不滿意","不滿意","普通","滿意","非常滿意"];
  h(`<div class="panel" style="max-width:900px"><span class="pill">後測結尾 · 課程接受度與活動滿意度</span>
   <div class="q">今天教的內容好不好懂？</div>${choiceGroup("acc1",["好懂","還可以","不好懂"],e)}
   <div class="q">對您有沒有用？</div>${choiceGroup("acc2",["有用","還可以","沒用"],e)}
   <div class="q">會不會推薦給朋友？</div>${choiceGroup("acc3",["會","可能","不會"],e)}
   <h3 style="font-size:20px;margin-top:22px">USR 活動滿意度</h3>
   <div class="q">1. 今天的活動整體您滿意嗎？</div>${choiceGroup("usr1",sat,e)}
   <div class="q">2. 學生講解清楚嗎？</div>${choiceGroup("usr2",sat,e)}
   <div class="q">3. 時間安排合適嗎？</div>${choiceGroup("usr3",sat,e)}
   <div class="q">4. 場地和設備合適嗎？</div>${choiceGroup("usr4",sat,e)}
   <div class="q">5. 以後有類似活動，您願意再來嗎？</div>${choiceGroup("usr5",sat,e)}
   <div class="q">「今天有什麼地方可以做得更好？」<small>學生記錄原話</small></div><textarea id="open">${esc(e.open||"")}</textarea>
   <div class="foot"><button type="button" id="prev">回模擬操作</button><button class="primary" type="button" id="next" disabled>完成後測</button></div></div>`);
  const need=["acc1","acc2","acc3","usr1","usr2","usr3","usr4","usr5"];
  const chk=()=>{document.getElementById("next").disabled=!need.every(k=>e[k]);}; bindGroups(e,chk); chk();
  document.getElementById("open").oninput=ev=>{e.open=ev.target.value;};
  document.getElementById("prev").onclick=screenSim; document.getElementById("next").onclick=finish;
}
function finish(){
  S.end=new Date().toISOString(); S.finished=true;
  const list=load().filter(r=>!(r.code===S.code&&r.phase===S.phase&&!r.finished)); list.push(S); save(list);
  const code=S.code, phase=S.phase; S=null; sessPill.hidden=true;
  h(`<div class="panel" style="max-width:720px"><h2 style="font-size:24px">已完成：${esc(code)} ${phase==="pre"?"前測":"後測"}</h2>
  <p>資料已存在這台平板。${phase==="pre"?"介入後再次輸入同一個識別碼，會自動進入後測。":"請在活動結束後到「紀錄與匯出」匯出 CSV。"}</p>
  <div class="row"><button class="primary" type="button" id="again">施測下一位</button><button type="button" id="adm">紀錄與匯出</button></div></div>`);
  document.getElementById("again").onclick=()=>screenStart(); document.getElementById("adm").onclick=screenAdmin;
}

/* ---------- 紀錄與匯出 ---------- */
function toCSV(list){
  const head=["識別碼","階段","卷別","分派","學生","開始","結束","序","題號","真假","把握","照做","追問","模擬_點連結","模擬_封鎖","模擬_刪除","模擬_查證","模擬_查證方式","模擬_備註","安全1","安全2","接受1","接受2","接受3","USR1","USR2","USR3","USR4","USR5","開放意見"];
  const rows=[head];
  list.forEach(r=>{ const e=r.extra||{}, s=r.sim||{};
    (r.answers||[]).forEach((a,i)=>rows.push([r.code,r.phase,r.form,r.assign,r.stu,r.start,r.end||"",a.seq,a.id,a.q1,a.q1c,a.q2,a.follow||"", i===0?(s.clicked?1:0):"", i===0?(s.blocked?1:0):"", i===0?(s.deleted?1:0):"", i===0?(s.verify?1:0):"", i===0?(s.verifyHow||""):"", i===0?(s.note||""):"", i===0?(e.safe1||""):"", i===0?(e.safe2||""):"", i===0?(e.acc1||""):"", i===0?(e.acc2||""):"", i===0?(e.acc3||""):"", i===0?(e.usr1||""):"", i===0?(e.usr2||""):"", i===0?(e.usr3||""):"", i===0?(e.usr4||""):"", i===0?(e.usr5||""):"", i===0?(e.open||""):""])); });
  return "﻿"+rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""').replace(/\n/g," ")}"`).join(",")).join("\r\n");
}
function screenAdmin(){
  const list=load();
  h(`<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="font-size:22px">紀錄與匯出</h2><button type="button" id="back">回施測</button></div>
   <p class="muted">這台平板共 ${list.length} 筆（每位長者前、後測各一筆）。資料只存在這台裝置，請在活動結束後匯出。</p>
   <div class="row" style="margin:10px 0"><button class="primary" type="button" id="dl">下載 CSV</button><button type="button" id="cp">複製 CSV 到剪貼簿</button><button type="button" id="clr">清除全部（測試用）</button></div>
   <div id="msg" class="muted"></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>識別碼</th><th>階段</th><th>卷</th><th>學生</th><th>開始</th><th>用時</th><th>題數</th><th></th></tr></thead><tbody>
   ${list.map((r,i)=>`<tr><td>${esc(r.code)}</td><td>${r.phase==="pre"?"前測":"後測"}</td><td>${esc(r.form)}</td><td>${esc(r.stu)}</td><td>${esc((r.start||"").slice(5,16).replace("T"," "))}</td><td>${r.end?Math.round((new Date(r.end)-new Date(r.start))/60000)+" 分":"未完成"}</td><td>${(r.answers||[]).length}</td><td><button type="button" data-del="${i}" style="min-height:36px;font-size:14px;padding:4px 10px">刪除</button></td></tr>`).join("")||`<tr><td colspan="8" class="muted">尚無紀錄</td></tr>`}
   </tbody></table></div>
   <textarea id="csvbox" style="margin-top:12px;min-height:120px;font-size:13px" readonly>${esc(toCSV(list))}</textarea>
   <p class="kbd">下載若被瀏覽器擋住（例如在 Claude 預覽中），改用「複製」或直接全選上方文字框。放到 GitHub Pages 後下載可正常使用。</p></div>`);
  const msg=document.getElementById("msg");
  document.getElementById("back").onclick=()=>S?screenItem(S.step||0):screenStart();
  document.getElementById("dl").onclick=()=>{ try{ const blob=new Blob([toCSV(list)],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`hub1204_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove(); msg.textContent="已嘗試下載；若沒有反應請改用複製。"; }catch(e){ msg.textContent="這個環境不允許下載，請改用複製。"; } };
  document.getElementById("cp").onclick=()=>{ const t=toCSV(list); navigator.clipboard.writeText(t).then(()=>msg.textContent="已複製。").catch(()=>{ const b=document.getElementById("csvbox"); b.focus(); b.select(); msg.textContent="無法自動複製，已幫您全選文字框，請手動複製。"; }); };
  let armed=false; document.getElementById("clr").onclick=e=>{ if(!armed){armed=true;e.target.textContent="再按一次確認清除";return;} save([]); screenAdmin(); };
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const l=load(); l.splice(+b.dataset.del,1); save(l); screenAdmin(); });
}
document.getElementById("btnAdmin").onclick=screenAdmin;
screenStart();
})();
</script>
</body></html>
